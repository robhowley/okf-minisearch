name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

      - name: Checkout
        if: steps.release.outputs.releases_created == 'true'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: steps.release.outputs.releases_created == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        if: steps.release.outputs.releases_created == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install npm 11
        if: steps.release.outputs.releases_created == 'true'
        # npm trusted publishing requires npm 11.5.1+ on Node 22.14+.
        run: npm install --global npm@11

      - name: Validate package before publishing
        if: steps.release.outputs.releases_created == 'true'
        run: pnpm package:check

      - name: Publish released packages
        if: steps.release.outputs.releases_created == 'true'
        env:
          RELEASED_PATHS: ${{ steps.release.outputs.paths_released }}
        shell: bash
        run: |
          set -euo pipefail

          released_paths="$(
            jq -ce '
              def known:
                . == "packages/okf-minisearch"
                or . == "packages/pi-okf-search";

              if type != "array" then
                error("paths_released must be a JSON array")
              elif length == 0 then
                error("paths_released must be nonempty when releases exist")
              elif any(.[]; type != "string") then
                error("paths_released must contain only strings")
              elif length != (unique | length) then
                error("paths_released contains duplicate paths")
              elif any(.[]; known | not) then
                error("paths_released contains an unknown path")
              else
                .
              end
            ' <<<"$RELEASED_PATHS"
          )"

          for package_path in \
            packages/okf-minisearch \
            packages/pi-okf-search
          do
            if ! jq -e --arg path "$package_path" \
              'index($path) != null' <<<"$released_paths" >/dev/null
            then
              continue
            fi

            (
              cd "$GITHUB_WORKSPACE/$package_path"

              pack_json="$(
                pnpm pack \
                  --pack-destination "$RUNNER_TEMP" \
                  --json
              )"

              tarball="$(
                jq -er '
                  if
                    (.filename | type == "string" and length > 0)
                    and (.name | type == "string" and length > 0)
                    and (.version | type == "string" and length > 0)
                  then .filename
                  else error("invalid pnpm pack result")
                  end
                ' <<<"$pack_json"
              )"

              test -f "$tarball"
              npm publish "$tarball" --access public
            )
          done
