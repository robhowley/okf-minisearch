name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

      - name: Checkout
        if: steps.release.outputs.releases_created == 'true'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: steps.release.outputs.releases_created == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        if: steps.release.outputs.releases_created == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install npm 11
        if: steps.release.outputs.releases_created == 'true'
        # npm trusted publishing requires npm 11.5.1+ on Node 22.14+.
        run: npm install --global npm@11

      - name: Validate package before publishing
        if: steps.release.outputs.releases_created == 'true'
        run: pnpm package:check

      - name: Publish released packages
        if: steps.release.outputs.releases_created == 'true'
        env:
          RELEASED_PATHS: ${{ steps.release.outputs.paths_released }}
        shell: bash
        run: |
          set -euo pipefail

          released_paths="$(
            jq -ce '
              . as $released_paths
              | [
                  "packages/okf-minisearch",
                  "packages/pi-okf-search"
                ] as $packages
              | if
                  ($released_paths | type) == "array"
                  and ($released_paths | length) > 0
                  and ($released_paths | all(.[]; type == "string"))
                  and ($released_paths | all(.[]; . as $path | $packages | index($path) != null))
                then
                  $packages
                  | map(. as $path | select($released_paths | index($path) != null))
                else
                  error("invalid paths_released")
                end
            ' <<<"$RELEASED_PATHS"
          )"

          package_paths="$(jq -er '.[]' <<<"$released_paths")"

          while IFS= read -r package_path; do
            (
              cd "$GITHUB_WORKSPACE/$package_path"

              pack_json="$(
                pnpm pack \
                  --pack-destination "$RUNNER_TEMP" \
                  --json
              )"

              tarball="$(
                jq -er '.filename | select(type == "string" and length > 0)' <<<"$pack_json"
              )"

              test -f "$tarball"
              npm publish "$tarball" --access public
            )
          done <<<"$package_paths"
