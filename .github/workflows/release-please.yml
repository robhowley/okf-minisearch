name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact non-draft release tag; unpublished recovery requires dispatch from main at that tag's commit
        required: true
        type: string

concurrency:
  group: release-please
  cancel-in-progress: false

permissions: {}

env:
  NPM_OWNER: robhowley
  SOURCE_REPOSITORY: https://github.com/robhowley/okf-minisearch
  PUBLICATION_WORKFLOW: .github/workflows/release-please.yml

jobs:
  release_please:
    name: Create releases
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Create release
        uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  release_metadata:
    name: Resolve immutable release metadata
    needs: release_please
    if: >-
      ${{
        always() &&
        (
          needs.release_please.result == 'success' ||
          (github.event_name == 'workflow_dispatch' && needs.release_please.result == 'skipped')
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_releases: ${{ steps.candidates.outputs.has_releases }}
      release_commit: ${{ steps.candidates.outputs.release_commit }}
      released_packages: ${{ steps.candidates.outputs.released_packages }}
      native_released: ${{ steps.candidates.outputs.native_released }}
      js_released_packages: ${{ steps.candidates.outputs.js_released_packages }}
    steps:
      - name: Checkout publication automation and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve exact release candidates
        id: candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(node scripts/release-candidates.mjs)"
          packages="$(jq -ce '.packages' <<<"$metadata")"
          echo "release_commit=$(jq -er '.commit' <<<"$metadata")" >>"$GITHUB_OUTPUT"
          echo "released_packages=$packages" >>"$GITHUB_OUTPUT"
          echo "has_releases=$(jq -r '.packages | length > 0' <<<"$metadata")" >>"$GITHUB_OUTPUT"
          echo "native_released=$(jq -r '.packages | any(.path == "packages/okf-search-native")' <<<"$metadata")" >>"$GITHUB_OUTPUT"
          echo "js_released_packages=$(jq -c '[.packages[] | select(.path != "packages/okf-search-native")]' <<<"$metadata")" >>"$GITHUB_OUTPUT"

  native_release_build:
    name: Release native artifact (${{ matrix.target }})
    needs: release_metadata
    if: needs.release_metadata.outputs.native_released == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            node-arch: x64
            artifact: okf-search-native.linux-x64-gnu.node
            napi-cross: true
            macos-deployment-target: ''
          - runner: macos-latest
            target: x86_64-apple-darwin
            node-arch: x64
            artifact: okf-search-native.darwin-x64.node
            napi-cross: false
            macos-deployment-target: '10.13'
          - runner: macos-latest
            target: aarch64-apple-darwin
            node-arch: arm64
            artifact: okf-search-native.darwin-arm64.node
            napi-cross: false
            macos-deployment-target: '10.13'
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            node-arch: x64
            artifact: okf-search-native.win32-x64-msvc.node
            napi-cross: false
            macos-deployment-target: ''
    steps:
      - name: Checkout immutable release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.release_commit }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          standalone: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          architecture: ${{ matrix.node-arch }}
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build native artifact
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos-deployment-target }}
        shell: bash
        run: |
          set -euo pipefail
          build_args=()
          if [[ "${{ matrix.napi-cross }}" == "true" ]]; then
            build_args+=(--use-napi-cross)
          fi
          pnpm --dir packages/okf-search-native exec napi build \
            --platform --release --js native.cjs --dts native.d.cts \
            --target "${{ matrix.target }}" \
            "${build_args[@]+"${build_args[@]}"}" -- --locked
      - name: Build source package facade
        run: pnpm --dir packages/okf-search-native run build:facade
      - name: Verify Linux glibc floor
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          artifact="packages/okf-search-native/${{ matrix.artifact }}"
          glibc_versions="$(objdump -T "$artifact" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' | sort -Vu || true)"
          test -n "$glibc_versions"
          max_glibc="$(printf '%s\n' "$glibc_versions" | tail -1)"
          echo "Maximum imported GLIBC symbol: $max_glibc"
          test "$(printf '%s\n' GLIBC_2.17 "$max_glibc" | sort -V | tail -1)" = GLIBC_2.17
      - name: Runtime smoke root and prepared
        run: pnpm --dir packages/okf-search-native run test:runtime
      - name: Verify exact nonempty artifact
        shell: bash
        run: test -s "packages/okf-search-native/${{ matrix.artifact }}"
      - name: Upload tested artifact
        uses: actions/upload-artifact@v4
        with:
          name: okf-search-native-${{ matrix.target }}
          path: packages/okf-search-native/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  native_candidate:
    name: Assemble and pack native candidate once
    needs: [release_metadata, native_release_build]
    if: needs.release_metadata.outputs.native_released == 'true' && needs.native_release_build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout immutable release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.release_commit }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          standalone: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build candidate facade
        run: pnpm --dir packages/okf-search-native run build:facade
      - name: Remove stale host and assembly output
        shell: bash
        run: |
          set -euo pipefail
          find packages/okf-search-native -maxdepth 1 -type f -name '*.node' -delete
          rm -rf packages/okf-search-native/npm "$RUNNER_TEMP/okf-native-artifacts"
      - name: Download only current-run tested artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: okf-search-native-*
          path: ${{ runner.temp }}/okf-native-artifacts
          merge-multiple: true
      - name: Assemble and verify exact native files
        working-directory: packages/okf-search-native
        shell: bash
        run: |
          set -euo pipefail
          rm -rf npm
          pnpm exec napi create-npm-dirs --npm-dir npm
          pnpm exec napi artifacts \
            --output-dir "$RUNNER_TEMP/okf-native-artifacts" \
            --npm-dir npm
          node scripts/verify-release-artifacts.mjs
      - name: Pack candidate once and record bytes
        env:
          RELEASE_COMMIT: ${{ needs.release_metadata.outputs.release_commit }}
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/native-candidate"
          mkdir -p "$destination"
          pack_json="$(cd packages/okf-search-native && pnpm pack --pack-destination "$destination" --json)"
          source_tarball="$(jq -er '.filename' <<<"$pack_json")"
          if [[ "$source_tarball" != /* ]]; then
            source_tarball="$GITHUB_WORKSPACE/packages/okf-search-native/$source_tarball"
          fi
          tarball="$destination/okf-search-native-candidate.tgz"
          mv "$source_tarball" "$tarball"
          node scripts/verify-release-candidate.mjs create \
            "$tarball" "$destination/candidate.json" "$RELEASE_COMMIT"
      - name: Upload approved candidate inputs
        uses: actions/upload-artifact@v4
        with:
          name: okf-search-native-candidate
          path: |
            ${{ runner.temp }}/native-candidate/okf-search-native-candidate.tgz
            ${{ runner.temp }}/native-candidate/candidate.json
          if-no-files-found: error
          retention-days: 7

  native_candidate_test:
    name: Candidate consumer (${{ matrix.target }})
    needs: [release_metadata, native_candidate]
    if: needs.release_metadata.outputs.native_released == 'true' && needs.native_candidate.result == 'success'
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            node-arch: x64
          - runner: macos-latest
            target: x86_64-apple-darwin
            node-arch: x64
          - runner: macos-latest
            target: aarch64-apple-darwin
            node-arch: arm64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            node-arch: x64
    steps:
      - name: Checkout immutable consumer proof
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.release_commit }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          standalone: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          architecture: ${{ matrix.node-arch }}
          cache: pnpm
      - name: Install proof dependencies without scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download exact candidate and metadata
        uses: actions/download-artifact@v4
        with:
          name: okf-search-native-candidate
          path: ${{ runner.temp }}/native-candidate
      - name: Verify candidate digest before install
        shell: bash
        run: |
          node scripts/verify-release-candidate.mjs verify \
            "$RUNNER_TEMP/native-candidate/okf-search-native-candidate.tgz" \
            "$RUNNER_TEMP/native-candidate/candidate.json" \
            "${{ needs.release_metadata.outputs.release_commit }}"
      - name: Test scripts-disabled root, types, lifecycle, directory, and prepared
        shell: bash
        run: |
          node scripts/verify-native-consumer.mjs \
            "$RUNNER_TEMP/native-candidate/okf-search-native-candidate.tgz" \
            --typescript "$GITHUB_WORKSPACE/node_modules/typescript/bin/tsc"

  publication_plan:
    name: Build, pack, and preflight every selected artifact
    needs: [release_metadata, native_candidate, native_candidate_test]
    if: >-
      ${{
        always() && needs.release_metadata.result == 'success' &&
        needs.release_metadata.outputs.has_releases == 'true' &&
        (
          (
            needs.release_metadata.outputs.native_released == 'false' &&
            needs.native_candidate.result == 'skipped' &&
            needs.native_candidate_test.result == 'skipped'
          ) ||
          (
            needs.release_metadata.outputs.native_released == 'true' &&
            needs.native_candidate.result == 'success' &&
            needs.native_candidate_test.result == 'success'
          )
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout publication automation
        uses: actions/checkout@v4
        with:
          path: automation
          persist-credentials: false
      - name: Checkout immutable release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.release_commit }}
          path: source
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          standalone: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Install immutable source dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Build and test selected JavaScript packages
        env:
          RELEASED_PACKAGES_JSON: ${{ needs.release_metadata.outputs.released_packages }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          if jq -e 'any(.path == "packages/okf-minisearch" or .path == "packages/pi-okf-search")' <<<"$RELEASED_PACKAGES_JSON" >/dev/null; then
            pnpm --filter okf-minisearch build
            pnpm --filter okf-minisearch test
          fi
          if jq -e 'any(.path == "packages/pi-okf-search")' <<<"$RELEASED_PACKAGES_JSON" >/dev/null; then
            pnpm --filter pi-okf-search typecheck
            pnpm --filter pi-okf-search test
          fi
      - name: Download tested native candidate
        if: needs.release_metadata.outputs.native_released == 'true'
        uses: actions/download-artifact@v4
        with:
          name: okf-search-native-candidate
          path: ${{ runner.temp }}/native-candidate
      - name: Verify tested native candidate
        if: needs.release_metadata.outputs.native_released == 'true'
        working-directory: automation
        shell: bash
        run: |
          node scripts/verify-release-candidate.mjs verify \
            "$RUNNER_TEMP/native-candidate/okf-search-native-candidate.tgz" \
            "$RUNNER_TEMP/native-candidate/candidate.json" \
            "${{ needs.release_metadata.outputs.release_commit }}"
      - name: Pack every selected JavaScript package and record immutable bytes
        env:
          RELEASED_PACKAGES_JSON: ${{ needs.release_metadata.outputs.released_packages }}
          RELEASE_COMMIT: ${{ needs.release_metadata.outputs.release_commit }}
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/publication-plan"
          mkdir -p "$destination"
          plan="$destination/plan.json"
          echo '[]' >"$plan"

          while IFS= read -r package; do
            package_path="$(jq -er '.path' <<<"$package")"
            name="$(jq -er '.name' <<<"$package")"
            version="$(jq -er '.version' <<<"$package")"
            jq -e --arg name "$name" --arg version "$version" \
              '.name == $name and .version == $version' \
              "$GITHUB_WORKSPACE/source/$package_path/package.json" >/dev/null

            if [[ "$package_path" == "packages/okf-search-native" ]]; then
              tarball="$RUNNER_TEMP/native-candidate/okf-search-native-candidate.tgz"
            else
              pack_json="$(cd "$GITHUB_WORKSPACE/source/$package_path" && pnpm pack --pack-destination "$destination" --json)"
              tarball="$(jq -er '.filename' <<<"$pack_json")"
              if [[ "$tarball" != /* ]]; then
                tarball="$GITHUB_WORKSPACE/source/$package_path/$tarball"
              fi
            fi
            test -f "$tarball"
            filename="$(basename "$tarball")"
            if [[ ! -f "$destination/$filename" ]]; then cp "$tarball" "$destination/$filename"; fi
            tarball="$destination/$filename"

            artifact="$(node automation/scripts/release-publication-plan.mjs inspect \
              "$destination/$filename" "$package_path" "$name" "$version" "$RELEASE_COMMIT")"
            policy="$(node automation/scripts/npm-registry-state.mjs policy "$name" "$version")"
            jq -c --argjson artifact "$artifact" --argjson policy "$policy" \
              '. + [$artifact + {preflightState: $policy.state, distTag: $policy.distTag}]' \
              "$plan" >"$plan.next"
            mv "$plan.next" "$plan"
          done < <(jq -c '.[]' <<<"$RELEASED_PACKAGES_JSON")

          test "$(jq 'length' "$plan")" -eq "$(jq 'length' <<<"$RELEASED_PACKAGES_JSON")"
          node automation/scripts/release-publication-plan.mjs verify "$destination" "$plan" "$RELEASE_COMMIT"
      - name: Upload immutable publication plan and exact artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-publication-plan
          path: ${{ runner.temp }}/publication-plan
          if-no-files-found: error
          retention-days: 7

  publication_approval:
    name: Protected approval and trusted-publisher preflight
    needs: [release_metadata, publication_plan]
    if: needs.publication_plan.result == 'success'
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout publication automation
        uses: actions/checkout@v4
        with:
          path: automation
          persist-credentials: false
      - name: Download immutable publication plan
        uses: actions/download-artifact@v4
        with:
          name: release-publication-plan
          path: ${{ runner.temp }}/publication-plan
      - name: Setup Node.js for trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
      - name: Install npm 11
        run: npm install --global npm@11
      - name: Verify approved bytes and preflight provenance identity before mutation
        env:
          RELEASE_COMMIT: ${{ needs.release_metadata.outputs.release_commit }}
        shell: bash
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/publication-plan/plan.json"
          node automation/scripts/release-publication-plan.mjs verify \
            "$RUNNER_TEMP/publication-plan" "$plan" "$RELEASE_COMMIT"
          npm ping --registry=https://registry.npmjs.org
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error("npm 11.5.1+ is required")' "$(npm --version)"

          if jq -e 'any(.preflightState == "unpublished")' "$plan" >/dev/null; then
            test "$GITHUB_SHA" = "$RELEASE_COMMIT"
            test "$GITHUB_REF" = "refs/heads/main"
            test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
            test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
            oidc="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")"
            OIDC_JSON="$oidc" RELEASE_COMMIT="$RELEASE_COMMIT" node - <<'NODE'
          const token = JSON.parse(process.env.OIDC_JSON).value
          const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url'))
          if (payload.repository !== 'robhowley/okf-minisearch') throw new Error('OIDC repository mismatch')
          if (payload.ref !== 'refs/heads/main') throw new Error('OIDC ref mismatch')
          if (!payload.workflow_ref?.startsWith('robhowley/okf-minisearch/.github/workflows/release-please.yml@')) throw new Error('OIDC workflow mismatch')
          if (process.env.GITHUB_SHA !== process.env.RELEASE_COMMIT) throw new Error('OIDC provenance commit mismatch')
          NODE
          fi

  publish:
    name: Publish pre-approved missing exact versions in dependency order
    needs: [release_metadata, publication_plan, publication_approval]
    if: needs.publication_approval.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout publication automation
        uses: actions/checkout@v4
        with:
          path: automation
          persist-credentials: false
      - name: Download pre-approved publication artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-publication-plan
          path: ${{ runner.temp }}/publication-plan
      - name: Setup Node.js for trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
      - name: Install npm 11
        run: npm install --global npm@11
      - name: Verify all bytes, registry policy, and provenance commit before any mutation
        env:
          RELEASE_COMMIT: ${{ needs.release_metadata.outputs.release_commit }}
        shell: bash
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/publication-plan/plan.json"
          node automation/scripts/release-publication-plan.mjs verify \
            "$RUNNER_TEMP/publication-plan" "$plan" "$RELEASE_COMMIT"
          verified="$RUNNER_TEMP/publication-plan/verified-published.txt"
          : >"$verified"
          index=0

          while IFS= read -r package; do
            name="$(jq -er '.name' <<<"$package")"
            version="$(jq -er '.version' <<<"$package")"
            expected_tag="$(jq -r '.distTag // "-"' <<<"$package")"
            policy="$(node automation/scripts/npm-registry-state.mjs policy "$name" "$version")"
            actual_tag="$(jq -r '.distTag // "-"' <<<"$policy")"
            test "$actual_tag" = "$expected_tag"
            if [[ "$(jq -r '.state' <<<"$policy")" == "published" ]]; then
              metadata="$RUNNER_TEMP/publication-plan/pre-mutation-proof-$index.json"
              printf '%s\n' "$package" >"$metadata"
              node automation/scripts/verify-npm-publication.mjs \
                "$metadata" "$NPM_OWNER" "$SOURCE_REPOSITORY" "$PUBLICATION_WORKFLOW" "$expected_tag"
              printf '%s@%s\n' "$name" "$version" >>"$verified"
            else
              test "$GITHUB_SHA" = "$RELEASE_COMMIT"
              test "$GITHUB_REF" = "refs/heads/main"
              test "$expected_tag" = "latest"
            fi
            index=$((index + 1))
          done < <(jq -c '.[]' "$plan")
          test "$index" -eq "$(jq 'length' "$plan")"
      - name: Publish downloaded tarballs without build or pack
        shell: bash
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/publication-plan/plan.json"
          verified="$RUNNER_TEMP/publication-plan/verified-published.txt"
          test -f "$verified"
          while IFS= read -r package; do
            name="$(jq -er '.name' <<<"$package")"
            version="$(jq -er '.version' <<<"$package")"
            tarball="$RUNNER_TEMP/publication-plan/$(jq -er '.tarball' <<<"$package")"
            policy="$(node automation/scripts/npm-registry-state.mjs policy "$name" "$version")"
            if [[ "$(jq -r '.state' <<<"$policy")" == "published" ]]; then
              grep -Fx -- "$name@$version" "$verified" >/dev/null
              echo "Skipping exact version already on npm; immutable versions are never overwritten: $name@$version"
              continue
            fi
            dist_tag="$(jq -er '.distTag' <<<"$package")"
            npm publish "$tarball" --access public --provenance --tag "$dist_tag"
          done < <(jq -c '.[]' "$plan")

  registry_proof:
    name: Verify every registry artifact and provenance
    needs: [release_metadata, publication_plan, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout publication verification
        uses: actions/checkout@v4
        with:
          path: automation
          persist-credentials: false
      - name: Download immutable publication plan
        uses: actions/download-artifact@v4
        with:
          name: release-publication-plan
          path: ${{ runner.temp }}/publication-plan
      - name: Setup Node.js for registry proof
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
      - name: Install npm 11
        run: npm install --global npm@11
      - name: Verify exact owner, tag policy, bytes, integrity, workflow, and commit for every package
        shell: bash
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/publication-plan/plan.json"
          index=0
          while IFS= read -r package; do
            metadata="$RUNNER_TEMP/publication-plan/proof-$index.json"
            printf '%s\n' "$package" >"$metadata"
            dist_tag="$(jq -r '.distTag // "-"' <<<"$package")"
            node automation/scripts/verify-npm-publication.mjs \
              "$metadata" "$NPM_OWNER" "$SOURCE_REPOSITORY" "$PUBLICATION_WORKFLOW" "$dist_tag"
            index=$((index + 1))
          done < <(jq -c '.[]' "$plan")
          test "$index" -eq "$(jq 'length' "$plan")"

  js_post_publish_test:
    name: Exact JS registry install (${{ matrix.package.name }})
    needs: [release_metadata, publication_plan, registry_proof]
    if: needs.registry_proof.result == 'success' && needs.release_metadata.outputs.js_released_packages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.release_metadata.outputs.js_released_packages) }}
    steps:
      - name: Checkout immutable consumer proof
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.release_commit }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          registry-url: https://registry.npmjs.org
      - name: Install exact registry version scripts-disabled and run package smoke
        shell: bash
        run: node scripts/verify-js-consumer.mjs "${{ matrix.package.name }}" "${{ matrix.package.version }}"

  native_post_publish_test:
    name: Exact native registry install (${{ matrix.target }})
    needs: [release_metadata, publication_plan, registry_proof]
    if: needs.registry_proof.result == 'success' && needs.release_metadata.outputs.native_released == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            node-arch: x64
          - runner: macos-latest
            target: x86_64-apple-darwin
            node-arch: x64
          - runner: macos-latest
            target: aarch64-apple-darwin
            node-arch: arm64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            node-arch: x64
    steps:
      - name: Checkout immutable consumer proof
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.release_commit }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          standalone: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          architecture: ${{ matrix.node-arch }}
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install proof dependencies without scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download exact published version plan
        uses: actions/download-artifact@v4
        with:
          name: release-publication-plan
          path: ${{ runner.temp }}/publication-plan
      - name: Install exact registry version scripts-disabled and run shared native journey
        shell: bash
        run: |
          version="$(jq -er '.[] | select(.name == "okf-search-native") | .version' "$RUNNER_TEMP/publication-plan/plan.json")"
          node scripts/verify-native-consumer.mjs \
            "okf-search-native@$version" \
            --typescript "$GITHUB_WORKSPACE/node_modules/typescript/bin/tsc"
